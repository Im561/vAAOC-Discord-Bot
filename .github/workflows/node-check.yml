name: Node Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax and import check
        run: npm run check
      - name: Build Railway Docker image
        run: docker build -t aaoc-discord-bot:test .
